name: Rosemary Kernel Build

on:
  # Manual trigger
  workflow_dispatch:

  # Scheduled build every 15 days at 03:00 UTC
  schedule:
    - cron: '0 3 */15 * *'

  # Trigger when your fork branch (Lineage kernel) is updated
  push:
    branches:
      - main  # replace with your branch if different
    paths:
      - 'kernel/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------
    # 1. Checkout your repo
    # ---------------------------------------
    - name: 🔄 Checkout Repository
      uses: actions/checkout@v4

    # ---------------------------------------
    # 2. Clone LineageOS Kernel (fetch latest upstream)
    # ---------------------------------------
    - name: 🌳 Clone & Update LineageOS Kernel
      run: |
        if [ ! -d "kernel" ]; then
          git clone -b lineage-23.0 https://github.com/LineageOS/android_kernel_xiaomi_mt6785 kernel
        fi
        cd kernel
        git fetch origin
        git reset --hard origin/lineage-23.0
        cd ..

    # ---------------------------------------
    # 3. Setup CCACHE
    # ---------------------------------------
    - name: ⚡ Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: rosemary-kernel-${{ github.sha }}

    # ---------------------------------------
    # 4. Install Build Dependencies
    # ---------------------------------------
    - name: 🛠️ Install Build Packages
      run: |
        sudo apt update
        sudo apt install -y bc bison flex build-essential ccache curl wget git \
          libssl-dev libncurses5-dev python3 zip unzip rsync clang llvm lld

    # ---------------------------------------
    # 5. Download Clang Toolchain
    # ---------------------------------------
    - name: ⬇️ Download AOSP Prebuilt Clang 18
      run: |
        mkdir -p toolchain
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r522817/bin.tar.gz -O toolchain/clang.tar.gz
        tar -xvf toolchain/clang.tar.gz -C toolchain
        rm toolchain/clang.tar.gz

    # ---------------------------------------
    # 6. Build the Kernel
    # ---------------------------------------
    - name: 🏗️ Build Kernel
      run: |
        cd kernel
        mkdir -p out
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$PWD/../toolchain/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        export LLVM=1
        export LLVM_IAS=1

        make O=out rosemary_defconfig
        make O=out -j$(nproc)
        cd ..

    # ---------------------------------------
    # 7. Package Kernel into Flashable ZIP (AnyKernel3)
    # ---------------------------------------
    - name: 📦 Package Kernel ZIP
      run: |
        if [ ! -d "AnyKernel3" ]; then
          git clone https://github.com/osm0sis/AnyKernel3.git
        fi
        cd AnyKernel3
        
        # Configure for Rosemary
        cat > anykernel.sh << 'EOF'
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers
        
        ## AnyKernel setup
        properties() { '
        kernel.string=Rosemary Kernel - LineageOS with Charging Fixes
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=rosemary
        device.name2=secret
        supported.versions=
        supported.patchlevels=
        '; }
        
        ## AnyKernel methods (DO NOT CHANGE)
        # import patching functions/variables - see for reference
        . tools/ak3-core.sh
        
        ## AnyKernel boot install
        dump_boot
        
        # begin ramdisk changes
        # end ramdisk changes
        
        write_boot
        ## end boot install
        EOF
        
        # Copy kernel files
        rm -f Image.gz* dtbo.img *.zip
        cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
        cp ../kernel/out/arch/arm64/boot/dtbo.img . || true
        
        # Create properly structured ZIP
        zip -r9 ../rosemary-kernel.zip * -x .git .gitignore .gitattributes README.md
        cd ..
        mv rosemary-kernel.zip AnyKernel3/

    # ---------------------------------------
    # 8. Upload Artifact
    # ---------------------------------------
    - name: ⬆️ Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: rosemary-kernel
        path: AnyKernel3/rosemary-kernel.zip
