name: Rosemary Kernel Build

on:
  # Manual trigger
  workflow_dispatch:

  # Scheduled build every 15 days at 03:00 UTC
  schedule:
    - cron: '0 3 */15 * *'

  # Trigger when your fork branch (Lineage kernel) is updated
  push:
    branches:
      - main  # replace with your branch if different  paths is:
      - 'kernel/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------
    # 1. Checkout your repo
    # ---------------------------------------
    - name: 🔄 Checkout Repository
      uses: actions/checkout@v4

    # ---------------------------------------
    # 2. Clone LineageOS Kernel (fetch latest upstream)
    # ---------------------------------------
    - name: 🌳 Clone & Update LineageOS Kernel
      run: |
        set -euo pipefail
        REPO_URL=https://github.com/LineageOS/android_kernel_xiaomi_mt6785
        BRANCH=lineage-23.0

        rm -rf kernel
        git init kernel
        cd kernel
        git remote add origin $REPO_URL
        git fetch --depth=1 origin $BRANCH
        git checkout -b $BRANCH FETCH_HEAD
        git clean -fdx
        cd ..

    # ---------------------------------------
    # 3. Setup CCACHE
    # ---------------------------------------
    - name: ⚡ Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: rosemary-kernel-${{ github.sha }}

    # ---------------------------------------
    # 4. Install Build Dependencies
    # ---------------------------------------
    - name: 🛠️ Install Build Packages
      run: |
        sudo apt update
        sudo apt install -y bc bison flex build-essential ccache curl wget git \
          libssl-dev libncurses5-dev python3 zip unzip rsync clang llvm lld

    # ---------------------------------------
    # 5. Download Clang Toolchain
    # ---------------------------------------
    - name: ⬇️ Download AOSP Prebuilt Clang 18
      run: |
        mkdir -p toolchain
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r522817/bin.tar.gz -O toolchain/clang.tar.gz
        tar -xvf toolchain/clang.tar.gz -C toolchain
        rm toolchain/clang.tar.gz

    # ---------------------------------------
    # 6. Integrate KernelSU Next (kprobe)
    # ---------------------------------------
    - name: 🔐 Integrate KernelSU Next
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

        DEFCONFIG=arch/arm64/configs/rosemary_defconfig
        ensure_config() {
          if ! grep -q "^$1" "$DEFCONFIG"; then
            echo "$1" >> "$DEFCONFIG"
          fi
        }

        ensure_config "CONFIG_KPROBES=y"
        ensure_config "CONFIG_HAVE_KPROBES=y"
        ensure_config "CONFIG_KPROBE_EVENTS=y"
        ensure_config "CONFIG_KSU=y"

    # ---------------------------------------
    # 7. Build the Kernel
    # ---------------------------------------
    - name: 🏗️ Build Kernel
      run: |
        cd kernel
        mkdir -p out
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$PWD/../toolchain/bin:$PATH
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        export LLVM=1
        export LLVM_IAS=1

        make O=out rosemary_defconfig
        make O=out -j$(nproc)

        # Build additional partitions required for flashing
        make O=out vendor_bootimage
        make O=out dtbo.img
        make O=out vbmeta.img
        cd ..

    # ---------------------------------------
    # 8. Package Kernel into Flashable ZIP (AnyKernel3)
    # ---------------------------------------
    - name: 📦 Package Kernel ZIP
      run: |
        # Clone AnyKernel3
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cd AnyKernel3
        
        # Remove example files
        rm -f Image.gz-dtb dtbo.img vendor_boot.img vbmeta.img zImage* Image* *.img
        
        # Copy kernel image
        cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
        cp ../kernel/out/arch/arm64/boot/dtbo.img dtbo.img
        cp ../kernel/out/arch/arm64/boot/vendor_boot.img vendor_boot.img
        cp ../kernel/out/arch/arm64/boot/vbmeta.img vbmeta.img
        
        # Configure AnyKernel3
        cat > anykernel.sh << 'EOF'
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers
        
        ## AnyKernel setup
        # begin properties
        properties() { '
        kernel.string=Rosemary Kernel + KernelSU Next
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=rosemary
        device.name2=secret
        device.name3=
        device.name4=
        device.name5=
        supported.versions=15-16
        supported.patchlevels=
        '; } # end properties
        
        # shell variables
        # Dynamic slot detection for boot partition
        slot=$(getprop ro.boot.slot_suffix)
        if [ -z "$slot" ]; then
          slot=$(getprop ro.boot.slot)
          [ -n "$slot" ] && slot="_$slot"
        fi

        boot_block=/dev/block/by-name/boot$slot
        vendor_boot_block=/dev/block/by-name/vendor_boot$slot
        if [ ! -e "$vendor_boot_block" ]; then
          vendor_boot_block=/dev/block/by-name/vendor_boot
        fi

        dtbo_block=/dev/block/by-name/dtbo$slot
        if [ ! -e "$dtbo_block" ]; then
          dtbo_block=/dev/block/by-name/dtbo
        fi

        vbmeta_block=/dev/block/by-name/vbmeta$slot
        if [ ! -e "$vbmeta_block" ]; then
          vbmeta_block=/dev/block/by-name/vbmeta
        fi

        block=$boot_block
        is_slot_device=1;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        
        ## AnyKernel methods (DO NOT CHANGE)
        # import patching functions/variables - see for reference
        . tools/ak3-core.sh;
        
        ## AnyKernel install
        dump_boot;
        
        # begin ramdisk changes
        
        # end ramdisk changes
        
        write_boot;

        # Flash vendor_boot if present
        if [ -f vendor_boot.img ] && [ -e "$vendor_boot_block" ]; then
          ui_print "- Flashing vendor_boot$slot"
          dd if=vendor_boot.img of=$vendor_boot_block 2>/dev/null || abort "Failed to flash vendor_boot$slot"
        fi

        # Flash dtbo if present
        if [ -f dtbo.img ] && [ -e "$dtbo_block" ]; then
          ui_print "- Flashing dtbo partition"
          dd if=dtbo.img of=$dtbo_block 2>/dev/null || abort "Failed to flash dtbo"
        fi

        # Flash vbmeta if present
        if [ -f vbmeta.img ] && [ -e "$vbmeta_block" ]; then
          ui_print "- Flashing vbmeta partition"
          dd if=vbmeta.img of=$vbmeta_block 2>/dev/null || abort "Failed to flash vbmeta"
        fi
        ## end install
        
        EOF
        
        # Create flashable ZIP
        zip -r9 ../rosemary-kernel.zip * -x .git README.md *placeholder
        cd ..
        mv rosemary-kernel.zip AnyKernel3/

    # ---------------------------------------
    # 9. Remove KernelSU sources to shrink artifact
    # ---------------------------------------
    - name: 🧹 Clean KernelSU Sources
      run: |
        rm -rf kernel/KernelSU kernel/.git/modules/KernelSU || true

    # ---------------------------------------
    # 9. Upload Artifact
    # ---------------------------------------
    - name: ⬆️ Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: rosemary-kernel
        path: AnyKernel3/rosemary-kernel.zip
